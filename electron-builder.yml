appId: com.selfimpulse.app
productName: SelfImpulse
copyright: Copyright © 2026 SelfImpulse
directories:
  output: release
  buildResources: resources
extraResources:
  - from: resources/icon.png
    to: icon.png
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SelfImpulse
  artifactName: SelfImpulse-Setup-${version}.${ext}
